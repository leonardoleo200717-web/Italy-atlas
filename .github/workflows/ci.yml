name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sorgenti dati (verifica checksum)
        run: npm run data:fetch
      - name: Validazione dati
        run: npm run data:validate
      - name: Pipeline dati
        run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - name: Test unitari e golden
        run: npm test
      - run: npm run build
      - name: Browser per i test E2E
        run: npx playwright install --with-deps chromium
      - name: Test E2E
        run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
